name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `version:` here — package.json's `packageManager` field pins pnpm, and
      # giving both makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: extractions/setup-just@v2
      - run: just setup
      - run: just check
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: extractions/setup-just@v2
      - run: just setup
      # CI has no .env, so the recipe's own guards fail the job if a key-shaped
      # literal ever reaches the bundle.
      - run: just store
      - run: ls -l cinder-wallet-store.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cinder-wallet-store
          path: cinder-wallet-store.zip
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    env:
      # `just ext` reads this; CI has no .env, so name the cluster the suite expects.
      VITE_NETWORK: devnet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: extractions/setup-just@v2
      - run: just setup
      - run: pnpm exec playwright install --with-deps chromium
      # The suite runs headless; xvfb is belt-and-braces for Chromium under CI.
      # Tests needing a funded fee payer skip with the shortfall when the public
      # devnet fixture has been swept, rather than failing.
      - run: xvfb-run -a just e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
